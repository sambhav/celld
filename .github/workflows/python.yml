name: Built-in Cloudflare Python and compiler hooks
on:
  pull_request:
    paths:
      - '.github/workflows/python.yml'
      - 'Cargo.*'
      - 'rust-toolchain*'
      - 'crates/**'
      - 'tools/packing-checks/**'
      - 'tools/python-runtime/**'
      - 'tools/python-checks/**'
      - 'examples/python/**'
  workflow_dispatch:
concurrency:
  group: python-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: python-native-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            python-native-${{ hashFiles('Cargo.lock') }}-
            fork-native-x86_64-unknown-linux-gnu-1.98.1-${{ hashFiles('Cargo.lock') }}-
            python-native-
      - run: node --test tools/python-checks/*.test.mjs
      - run: python tools/python-runtime/build.py target/lab/python-runtime
      - run: node tools/python-checks/pyodide-scheduler.mjs target/python-runtime-cache/314.0.6
        timeout-minutes: 1
      - run: |
          cargo test --manifest-path tools/packing-checks/Cargo.toml --locked
          cargo test -p celld-monty --locked
          cargo build -p celld --profile lab --locked
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: python-native-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - run: |
          cargo test -p celld --profile lab --lib python --locked
          cargo test -p celld --profile lab --lib shared_modules::tests --locked
          cargo test -p celld --profile lab --test build_hooks --locked
      - run: python tools/python-checks/smoke.py target/lab/celld
      - run: pip install 'git+https://github.com/sambhav/celld-python@330dcfc607a542351acb54cedd1946cc22d83826'
      - run: python tools/python-checks/durable.py target/lab/celld
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-native
          path: |
            target/lab/celld
            target/lab/python-runtime/*
