name: Native Python versus TypeScript
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CELLD_NATIVE_SHA: 37e41ff2dcd6e1097f4207406a6b5a63a8e647fc
jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.label.name, 'benchmark-native-python')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: python-native
          path: native-bin
          run-id: 34019509877
          github-token: ${{ github.token }}
      - run: |
          chmod +x native-bin/celld
          npm install -g esbuild@0.25.12
          cd tools/python-bench/load
          go test -race ./...
      - if: github.event.label.name == 'benchmark-native-python-final'
        run: python tools/python-runtime/build.py candidate-runtime
      - if: github.event.label.name != 'benchmark-native-python-final'
        run: python tools/python-bench/measure.py --binary native-bin/celld --baseline-runtime native-bin/python-runtime
      - if: github.event.label.name == 'benchmark-native-python-final'
        run: python tools/python-bench/measure.py --binary native-bin/celld --baseline-runtime native-bin/python-runtime --candidate-runtime candidate-runtime --variants baseline,candidate,typescript --rounds 3 --seconds 10 --clients 256 --delays 10,50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-python-measurements
          path: |
            tools/python-bench/build/**/measurements.json
            tools/python-bench/build/**/*.log
